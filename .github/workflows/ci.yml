name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint-and-syntax:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.15.16

      - name: Run ruff syntax check (E9=runtime errors, F63=undefined, F7=undefined, F82=undefined)
        run: ruff check --select E9,F63,F7,F82 --exclude core/test .

      - name: Basic Python syntax check
        run: |
          find . -name "*.py" -not -path "./venv/*" -not -path "./.git/*" -exec python -m py_compile {} \;

  pr-checks:
    name: PR Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify PR title format
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "PR Title: $TITLE"
          if [[ ${#TITLE} -gt 100 ]]; then
            echo "::warning::PR title exceeds 100 characters"
          fi
          if [[ "$TITLE" =~ ^(fix|feat|docs|refactor|test|chore|ci)(\(.+\))?: ]]; then
            echo "✓ Conventional commit format detected"
          else
            echo "::notice::Consider using conventional commit format: fix|feat|docs|refactor|test|chore|ci"
          fi

      - name: Check for WIP in title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ "$TITLE" =~ [Ww][Ii][Pp] ]]; then
            echo "::warning::PR title contains WIP — ensure ready for review"
          fi