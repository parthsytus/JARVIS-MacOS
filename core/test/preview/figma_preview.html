<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JARVIS Figma Preview</title>
<meta http-equiv="refresh" content="3">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0D0D0D;
    display:flex; flex-direction:column;
    align-items:center; min-height:100vh;
    font-family: 'Inter', sans-serif;
    color: #E0E0E0;
    padding: 20px;
  }
  .header {
    display:flex; align-items:center; gap:12px;
    margin-bottom:20px; padding:12px 24px;
    background:rgba(0,255,136,0.08);
    border:1px solid rgba(0,255,136,0.2);
    border-radius:12px;
  }
  .header .dot { width:10px; height:10px; border-radius:50%; background:#00FF88; box-shadow:0 0 8px #00FF88; }
  .header h1 { font-size:18px; font-weight:600; color:#00FF88; }
  .header .info { font-size:13px; color:#888; margin-left:16px; }
  .canvas-wrapper {
    border:1px solid #333; border-radius:8px;
    overflow:hidden; box-shadow:0 8px 32px rgba(0,0,0,0.5);
    position:relative;
  }
  .canvas {
    width:1920px; height:1080px;
    background:#F5F5F5; position:relative;
    transform-origin: top left;
    transform: scale(0.55);
  }
  .figma-node {
    position:absolute;
    transition: outline 0.2s;
  }
  .figma-node:hover {
    outline: 2px solid #00FF88;
    outline-offset: 2px;
    z-index:1000;
  }
  .figma-text {
    pointer-events:auto;
  }
  .node-label {
    position:absolute; top:-18px; left:0;
    font-size:10px; color:#00FF88;
    opacity:0; transition:opacity 0.2s;
    white-space:nowrap;
    background:rgba(0,0,0,0.7); padding:2px 6px; border-radius:4px;
  }
  .figma-node:hover .node-label { opacity:1; }
  .footer {
    margin-top:16px; font-size:12px; color:#555;
    display:flex; gap:20px;
  }
  .footer .count { color:#00FF88; font-weight:600; }
</style>
</head>
<body>
  <div class="header">
    <div class="dot"></div>
    <h1>JARVIS — Figma Live Preview</h1>
    <span class="info">Auto-refreshes every 3s · Hover elements to inspect</span>
  </div>
  <div class="canvas-wrapper" style="width:1056px; height:594px;">
    <div class="canvas">
      <div class="figma-node figma-shape" style="
            left:100px; top:100px; width:500px; height:300px;
            background:#FF0000; border-radius:0px;
        " title="Rectangle">
            <span class="node-label">Rectangle</span>
        </div>
<div class="figma-node figma-text" style="
            left:150px; top:30px;
            font-size:42px; font-family:'Inter', sans-serif;
            color:#007AFF; white-space:nowrap;
        " title="Text">BGMI TOURNAMENT 2026</div>
<div class="figma-node figma-frame" style="
            left:200px; top:450px; width:300px; height:50px;
            background:#0066FF; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:8px;
        " title="Button Container">
            <span class="node-label">Button Container</span>
        </div>
<div class="figma-node figma-text" style="
            left:0px; top:0px;
            font-size:16px; font-family:'Inter', sans-serif;
            color:#FFFFFF; white-space:nowrap;
        " title="Button Label">Register Now</div>
<div class="figma-node figma-frame" style="
            left:50px; top:50px; width:700px; height:550px;
            background:#F5F5F5; border-radius:0px; 
        " title="Frame">
            <span class="node-label">Frame</span>
        </div>

    </div>
  </div>
  <div class="footer">
    <span>Canvas: <span class="count">1920×1080</span></span>
    <span>Elements: <span class="count">5</span></span>
    <span>Blueprints: <span class="count">4</span></span>
    <span>Updated: <span class="count">12:20:35</span></span>
  </div>
</body>
</html>
